
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduVerse AI</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-brand">
            <a href="../index.html" class="logo">EduVerse<span>AI.</span></a>

            <div class="brand-content">
                <p class="tagline">YOUR PERSONAL AI LEARNING WORLD</p>
                <h1>Welcome Back!</h1>
                <p>Continue your learning journey with intelligent AI-powered tools.</p>
            </div>

            <div class="brand-footer">
                Learn Smarter. Grow Faster. Achieve More.
            </div>
        </div>

        <div class="auth-form-section">
            <div class="form-box">

                <h2>Sign In</h2>
                <p class="subtitle">Enter your details to access your account.</p>

                <form id="loginForm">

                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>

                    <label for="password">Password</label>
                    <div class="password-box">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" data-target="password">Show</button>
                    </div>

                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox" id="remember">
                            Remember me
                        </label>
                        <a href="#" id="forgotPassword">Forgot password?</a>
                    </div>

                    <button type="submit" class="submit-btn">Login to EduVerse</button>

                    <p id="message" class="message"></p>

                </form>

                <p class="switch-text">
                    Don't have an account?
                    <a href="register.html">Create Account</a>
                </p>

                <a href="../index.html" class="back-home">← Back to Home</a>

            </div>
        </div>

    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
