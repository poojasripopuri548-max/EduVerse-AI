
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EduVerse AI</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

    <div class="auth-container">

        <div class="auth-brand">
            <a href="../index.html" class="logo">EduVerse<span>AI.</span></a>

            <div class="brand-content">
                <p class="tagline">START YOUR JOURNEY</p>
                <h1>Create Your Future.</h1>
                <p>Join EduVerse AI and unlock a smarter, personalized learning experience.</p>
            </div>

            <div class="brand-footer">
                Your Future Begins Here.
            </div>
        </div>

        <div class="auth-form-section">
            <div class="form-box">

                <h2>Create Account</h2>
                <p class="subtitle">Register to begin your learning journey.</p>

                <form id="registerForm">

                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>

                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter your email" required>

                    <label for="regPassword">Password</label>
                    <div class="password-box">
                        <input type="password" id="regPassword" placeholder="Create a password" minlength="8" required>
                        <button type="button" class="toggle-password" data-target="regPassword">Show</button>
                    </div>

                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>

                    <label for="role">I am a</label>
                    <select id="role" required>
                        <option value="">Select your role</option>
                        <option value="student">Student</option>
                        <option value="educator">Educator</option>
                    </select>

                    <button type="submit" class="submit-btn">Create My Account</button>

                    <p id="registerMessage" class="message"></p>

                </form>

                <p class="switch-text">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </p>

                <a href="../index.html" class="back-home">← Back to Home</a>

            </div>
        </div>

    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
